# Build the course site, validate it, and publish it to GitHub Pages.
#
# Trigger: every push to master (the default branch), plus manual dispatch.
# Hosting: project site at https://nadeem-majeedch.github.io/Securing-AI-Systems/
#          (base path /Securing-AI-Systems/, set by `site_url` in mkdocs.yml).
# Docs:     DEPLOYMENT.md
#
# Security model
# - No repository secret is used. The only credential is the ephemeral
#   GITHUB_TOKEN, scoped per job by the `permissions` blocks below.
# - The build job is read-only. Only the deploy job can write to Pages, and it
#   proves its origin with an OIDC token rather than a stored secret.
# - Actions are pinned to full commit SHAs (with the release tag in a comment),
#   all of them first-party `actions/*`. No third-party action runs.
# - Checkout does not persist the token into .git/config, so build steps cannot
#   push or fetch with it.

name: Deploy course site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Default denial. Each job grants exactly what it needs.
permissions:
  contents: read

# One Pages deployment at a time. Do not cancel a run mid-deploy: a cancelled
# deployment can leave the published site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"          # the site is full of non-ASCII (∇, §, —); fail loudly, not silently
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Confirm documentation dependencies are exactly pinned
        # requirements-docs.txt is the contract that makes a build reproducible.
        # A range instead of a pin is a silent upgrade, so it fails here.
        run: |
          python - <<'PY'
          import pathlib, re, sys
          lines = [l.strip() for l in pathlib.Path("requirements-docs.txt").read_text(encoding="utf-8").splitlines()]
          unpinned = [l for l in lines if l and not l.startswith("#") and "==" not in l]
          print("pinned requirements:", len([l for l in lines if l and not l.startswith("#")]))
          if unpinned:
              print("FAIL: not pinned:", unpinned)
              sys.exit(1)
          PY

      - name: Install documentation dependencies
        # Only requirements-docs.txt: the lab stack (PyTorch and friends) is
        # never installed in CI, so a documentation build cannot pull a GB of
        # training libraries, and a lab dependency cannot break publishing.
        run: python -m pip install --no-input -r requirements-docs.txt

      - name: Check internal links, anchors and navigation
        # Fails on a broken relative link, a missing anchor, or a page that
        # links to a file that does not exist. Internal only: no network.
        run: python scripts/check_links.py

      - name: Check the notebook output policy
        # Every notebook is valid nbformat 4 with a python3 kernel, carries no
        # absolute paths and stays inside the size budget. Static only: the
        # full execution run lives in the Phase 14 validation, not in CI.
        run: python scripts/check_notebooks.py

      - name: Build the site
        # --strict turns a missing nav entry, a broken reference and a warning
        # into a build failure. This is the gate that keeps 157 pages honest.
        run: python -m mkdocs build --strict

      - name: Verify the built site
        # Structure, base-path correctness for project-site hosting, assets,
        # search index, diagrams, privacy invariants and artifact size.
        run: python scripts/verify_site.py site --base-path /Securing-AI-Systems/

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # A manual run from a feature branch validates the build above but must
    # never publish: only the default branch is deployable.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write       # publish the artifact
      id-token: write    # OIDC proof that this run built it
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 5000
