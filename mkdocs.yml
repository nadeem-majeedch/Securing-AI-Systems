# Securing AI Systems — site configuration
#
# Build:  python -m mkdocs build --strict
# Serve:  python -m mkdocs serve
#
# Publishing configuration (site_url, repo_url, deploy workflow) is deliberately
# absent: the site is not yet authorised for publication. See DEPLOYMENT.md.

site_name: Securing AI Systems
site_description: >-
  A practical self-study course on securing machine learning and generative AI
  systems, for BS Data Science students.
site_author: Engr. Dr. Muhammad Nadeem Majeed
docs_dir: docs

# Project site, not a user/root site: the published address is
# https://nadeem-majeedch.github.io/Securing-AI-Systems/ so every URL, the
# canonical tag, the sitemap and the `url` filter in templates carry this base
# path. Changing the repository name, or moving to a custom domain, means
# changing this one line and rebuilding. See DEPLOYMENT.md §3.
site_url: https://nadeem-majeedch.github.io/Securing-AI-Systems/

copyright: >-
  Course content © Muhammad Nadeem Majeed · Department of Data Science (PUCIT),
  University of the Punjab, Lahore

# Instructor material is excluded from the build, not merely unlinked.
exclude_docs: |
  instructor/

# The 404 page is authored as a static template (overrides/404.html) because
# Material renders static templates without page content. It is not a docs page.

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
theme:
  name: material
  custom_dir: overrides
  language: en

  # no Google Fonts request; the design system defines a system font stack
  font: false

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

# ---------------------------------------------------------------------------
# Markdown
# ---------------------------------------------------------------------------
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: sas-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      # Line-number anchors are empty <a href> elements: they add one unnamed
      # tab stop per line of code for keyboard and screen-reader users, and
      # nothing links to them in a course page. Line spans are kept for
      # annotation and copy support.
      anchor_linenums: false
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.tilde

plugins:
  - search

# ---------------------------------------------------------------------------
# Assets
# ---------------------------------------------------------------------------
extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/quiz.css

extra_javascript:
  - assets/javascript/progress.js
  - assets/javascript/diagrams.js

